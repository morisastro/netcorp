name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Build with PyInstaller (onedir + spec)
        run: pyinstaller --noconfirm --clean netcorp.spec

      - name: Copy LICENSE
        shell: bash
        run: cp LICENSE dist/netcorp-tycoon/LICENSE

      - name: Get version from tag
        id: ver
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact=netcorp-tycoon-v${VERSION}-${{ matrix.platform }}.zip" >> $GITHUB_OUTPUT

      - name: Package ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\netcorp-tycoon\*" -DestinationPath "${{ steps.ver.outputs.artifact }}"

      - name: Package ZIP (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          zip -r "../${{ steps.ver.outputs.artifact }}" netcorp-tycoon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: ${{ steps.ver.outputs.artifact }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read changelog
        id: changelog
        run: |
          # Wczytaj changelog z CHANGELOG.md (sekcja dla danej wersji lub caly plik)
          if [ -f CHANGELOG.md ]; then
            BODY=$(cat CHANGELOG.md)
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body=Release v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          name: NetCorp Tycoon v${{ steps.ver.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: false