name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: netcorp-tycoon-v${{ github.ref_name }}-win.zip
          - os: ubuntu-latest
            artifact: netcorp-tycoon-v${{ github.ref_name }}-linux.zip
          - os: macos-latest
            artifact: netcorp-tycoon-v${{ github.ref_name }}-mac.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build with PyInstaller (onedir + spec)
        run: pyinstaller --noconfirm --clean netcorp.spec

      - name: Copy LICENSE
        shell: bash
        run: cp LICENSE dist/netcorp-tycoon/LICENSE

      - name: Package ZIP
        shell: bash
        run: |
          cd dist
          zip -r "../${{ matrix.artifact }}" netcorp-tycoon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
          name: NetCorp Tycoon ${{ github.ref_name }}